name = "salma-api"
main = "salma-worker.js"
compatibility_date = "2024-01-01"

[placement]
mode = "smart"

# Secret requerido (añadir con wrangler secret put OPENAI_API_KEY):
# OPENAI_API_KEY = "sk-proj-..."

[[kv_namespaces]]
binding = "SALMA_KB"
id = "b2056c0613d94feb955b92279ba02fb6"

# Geometría real de carreteras con nombre (OSM), cacheada por road-resolver.js.
# Namespace propio (no prefijo en SALMA_KB) para poder compartirlo con una futura
# app aparte sin migración. Clave: road_geom:v1:{cc}:{slug}
[[kv_namespaces]]
binding = "ROAD_GEOM"
id = "39ff0d3316ab43d9b78f1f14b746e5ad"

# Expone el Version ID real del despliegue dentro del Worker (env.CF_VERSION_METADATA).
# Sirve para el endpoint /version: asi se puede comprobar en 2 segundos que version esta
# corriendo de verdad, en vez de discutir a ciegas si un cambio esta subido o no.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[r2_buckets]]
binding = "SALMA_PHOTOS"
bucket_name = "salma-photos"

# Cron: lunes 4:00 UTC = regenera fichas nivel 1 caducadas
# Cron: diario 6:00 UTC = monitoreo precios vuelos (flight watches)
# (el de miércoles 4:00, rutas nivel 3, se quitó el 17 sept 2026 — nunca generó
# ni una ruta en producción: bug de scan con limit:500 sobre >3000 claves dest:*
# + sin verificación real de Google Places. Ver project_kv_estado en memoria.)
[triggers]
crons = ["0 4 * * 1", "0 6 * * *"]

[vars]
# Remitente de los emails (Resend). Dominio borradodelmapa.com verificado en Resend el 26 sept 2026
# (DKIM resend._domainkey + CNAME send/rsend en el DNS de Netlify).
RESEND_FROM = "Salma · Borrado del Mapa <salma@borradodelmapa.com>"
# Optional: use Workers AI instead — set USE_CLOUDFLARE_AI = "1" and add binding:
# [ai]
# binding = "AI"
