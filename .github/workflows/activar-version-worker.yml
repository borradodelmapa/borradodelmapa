name: Activar version del Worker

# Disparo manual. Pone al 100 % una versión del Worker llamando directamente a la API de Cloudflare, sin
# `wrangler deploy` (12 oct 2026: wrangler fallaba con "Received a malformed response from the API" al leer la
# versión activa, caso p-mulprefz0fz).
# - Con version_id: activa esa versión ya subida (la de `npx wrangler versions upload`).
# - Sin version_id: sube el código de main con `wrangler versions upload` y activa la versión nueva.
# No toca secrets. Los crons y rutas no cambian con esto (si se tocan, hace falta `wrangler triggers deploy`).
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version ID completo (vacío = subir main y activarlo)"
        required: false
        default: ""

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.version_id == '' }}
      - name: Subir el código (sin activarlo)
        id: subir
        if: ${{ inputs.version_id == '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions upload -c wrangler.toml | tee subida.log
          VID=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' subida.log | grep -oE '[0-9a-f-]{36}')
          [ -n "$VID" ] || { echo "No salió el Version ID"; exit 1; }
          echo "vid=$VID" >> "$GITHUB_OUTPUT"
      - name: Poner la versión al 100 %
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id != '' && inputs.version_id || steps.subir.outputs.vid }}
        run: |
          echo "$VERSION_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "Version ID no válido"; exit 1; }
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/accounts/f0c9caa483309964a6a236f9556993ec/workers/scripts/salma-api/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"strategy\":\"percentage\",\"versions\":[{\"percentage\":100,\"version_id\":\"$VERSION_ID\"}]}"
          echo ""
          echo "Activada: $VERSION_ID"
