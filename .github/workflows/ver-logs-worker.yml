name: Ver logs del Worker

# Disparo manual. Escucha los logs de salma-api unos minutos (wrangler tail) mientras Paco prueba en el móvil y deja
# en el resultado solo las líneas útiles. Sirve desde la nube, sin el portátil. No cambia nada del Worker.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos escuchando (1-10)"
        required: false
        default: "4"
      filtro:
        description: "Texto a buscar en los logs (regex de grep)"
        required: false
        default: "AYUDA|CACHE|CHAT-ENLACE|ERROR|Error"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escuchar
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIN: ${{ inputs.minutos }}
          FILTRO: ${{ inputs.filtro }}
        run: |
          S=$(( ${MIN:-4} * 60 )); [ "$S" -gt 600 ] && S=600
          timeout "$S" npx wrangler tail salma-api -c wrangler.toml --format pretty > tail.log 2>&1 || true
          echo "===== líneas que casan con: $FILTRO ====="
          grep -E "$FILTRO" tail.log | cut -c1-400 || echo "(ninguna)"
          echo "===== final del log ====="
          tail -n 40 tail.log | cut -c1-300
