<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor · Benarés</title>
<style>
:root{--bg:#0d0d0d;--card:#161616;--line:#2a2a2a;--or:#F4630B;--az:#4FB3C8;--tx:#eee;--mu:#999}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:2px solid var(--or);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;color:var(--or);margin-right:auto}
button{background:var(--or);color:#000;border:0;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:#2a2a2a;color:var(--tx)}button:disabled{opacity:.5;cursor:wait}
main{max-width:1100px;margin:0 auto;padding:12px 16px 80px}
.blq{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mu);margin:12px 0;padding:10px 12px}
.blq.paco{border-left-color:var(--or)}.blq.salma{border-left-color:var(--az)}
.cab{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}.paco .cab{color:var(--or)}.salma .cab{color:var(--az)}
.txt{color:#ddd;margin:4px 0 8px}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shot{width:130px}.shot .im{position:relative;cursor:pointer;aspect-ratio:9/16;background:#000;overflow:hidden;border:2px solid transparent}
.shot .im:hover{border-color:var(--or)}.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .id{position:absolute;left:0;top:0;background:#000b;color:var(--or);font-weight:700;font-size:12px;padding:2px 5px}
.shot .cm{position:absolute;right:0;bottom:0;background:var(--or);color:#000;font-size:11px;font-weight:700;padding:2px 5px}
.shot small{color:var(--mu);display:block;margin-top:2px;font-size:12px}
.shot.cambiado .im{border-color:#3c3}
.amb{margin-top:8px;font-size:13px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:#222;color:var(--tx);border:1px solid #444;padding:5px}
audio{height:30px}
#modal{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto}
#modal .in{max-width:1000px;margin:20px auto;background:#111;border:1px solid var(--or);padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{background:#222;color:var(--tx)}.tabs button.on{background:var(--or);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.grid .g{position:relative;cursor:pointer;aspect-ratio:9/16;background:#000;overflow:hidden;border:2px solid transparent}
.grid .g:hover{border-color:var(--or)}.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .g span{position:absolute;left:0;top:0;background:#000b;color:var(--or);font-size:11px;font-weight:700;padding:1px 4px}
textarea{width:100%;background:#0d0d0d;color:#eee;border:1px solid #444;padding:7px;font:15px/1.4 system-ui,Arial,sans-serif;resize:vertical;min-height:62px}textarea.mod{border-color:#e9c;background:#1a0f18}
.grid .g.usada{border-color:#3c3}.grid .g.usada span{background:#3c3;color:#000}.grid .g.aqui{border-color:#fc0;box-shadow:0 0 0 2px #fc0}.grid .g.aqui span{background:#fc0;color:#000}
.grid .g .u{position:absolute;left:0;bottom:0;right:0;background:#000c;color:#9f9;font-size:10px;padding:1px 3px}
.leyenda{font-size:12px;color:var(--mu);margin:6px 0 10px}.leyenda b{padding:0 5px;color:#000}
.mini{font-size:12px;color:var(--mu)}.rojo{color:#e9c}
details.mov{margin-top:3px;font-size:12px}details.mov summary{cursor:pointer;color:var(--mu)}details.mov select{width:100%;background:#222;color:var(--tx);border:1px solid #444;padding:3px}summary.cab{list-style:revert}
table.tsnd{border-collapse:collapse;width:100%;font-size:12px}table.tsnd th{color:var(--mu);font-weight:400;text-align:left;padding:2px 6px}table.tsnd td{padding:3px 6px;border-top:1px solid var(--line)}table.tsnd input{width:64px;background:#0d0d0d;color:#eee;border:1px solid #444;padding:4px}table.tsnd select{max-width:200px}
#estado{font-size:13px;color:var(--mu);max-width:420px;white-space:pre-wrap}
#vid{margin:14px 0;display:none}#vid video{max-width:100%;max-height:60vh;background:#000}#panel{display:none;background:#111;border-bottom:1px solid var(--line);padding:12px 16px}#panel .bar{height:14px;background:#2a2a2a;margin:8px 0}#panel .bar i{display:block;height:100%;background:var(--or);width:0;transition:width .5s}#panel ol{margin:6px 0;padding-left:20px;color:var(--mu)}#panel li.hecho{color:#6c6}#panel li.ahora{color:var(--or);font-weight:700}#panel ul{margin:6px 0;padding-left:18px}#panel pre{white-space:pre-wrap;color:var(--mu);font-size:12px;margin:6px 0}
</style></head><body>
<header><h1>EDITOR · INDIA CAP. 4 · BENARÉS</h1><div id="mini" style="display:none;flex:1;min-width:200px;max-width:520px"><div id="minit" style="font-size:13px;font-weight:700;color:var(--or)"></div><div style="height:8px;background:#2a2a2a;margin-top:3px"><i id="minib" style="display:block;height:100%;width:0;background:var(--or);transition:width .5s"></i></div></div>
<button class="sec" id="reset">Deshacer cambios</button><button id="montar">▶ Montar</button></header>
<div id="panel"></div>
<main><div id="vid"><h3>Compara</h3><div style="display:flex;gap:14px;flex-wrap:wrap"><div><b>Con tus cambios</b><br><video id="vnuevo" controls></video></div><div id="vorig"><b>Original (v8)</b><br><video id="vold" controls></video></div></div></div><div id="portada"></div><div id="ajustes"></div><div id="lista">Cargando…</div></main>
<div id="modal3" style="display:none;position:fixed;inset:0;background:#000d;z-index:12;overflow:auto"><div style="max-width:420px;margin:20px auto;background:#111;border:1px solid var(--or);padding:12px"><b id="ft"></b><div style="position:relative;margin:8px 0;line-height:0"><img id="fimg" style="width:100%;cursor:crosshair"><div id="fmark" style="display:none;position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #F4630B;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none"></div></div><div style="display:flex;gap:8px"><button class="sec" id="fauto">Auto (centro)</button><button id="fcerrar">Listo</button></div></div></div>
<div id="modal2" style="display:none;position:fixed;inset:0;background:#000d;z-index:11;overflow:auto"><div style="max-width:520px;margin:20px auto;background:#111;border:1px solid var(--or);padding:12px"><b id="rt"></b><video id="rvid" controls style="width:100%;max-height:68vh;background:#000;margin:8px 0"></video><div id="rinfo" class="mini"></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button id="rpon">✂ Empezar aquí (donde está el vídeo)</button><button class="sec" id="rorig">Volver al original</button><button class="sec" id="rfin" style="display:none">✂ Terminar aquí</button><button class="sec" id="rcerrar">Cerrar</button></div><div class="mini" style="margin-top:6px">Pausa el vídeo donde quieras que EMPIECE el plano y pulsa «Empezar aquí». Lo que dura lo marca la frase.</div></div></div>
<div id="modal"><div class="in"><div style="display:flex;justify-content:space-between;align-items:center"><b id="mt"></b><button class="sec" id="cerrar">Cerrar</button></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div></div>
<script>
let D, ov = {shots:{},amb:{},text:{},audio:{},ss:{},portada:{},mov:{},seguir:{}}, ctx = null, tab = 'sony';
const $ = s => document.querySelector(s);
const fotoActual = (b, k) => (ov.shots[b.id] && ov.shots[b.id][k]) || b.shots[k].a;
const ambActual = b => ov.amb[b.id] || b.amb;
async function guardar(){ ov = await (await fetch('/api/guardar',{method:'POST',body:JSON.stringify(ov)})).json(); }
function pintar(){
  pintarPortada(); pintarAjustes();
  $('#lista').innerHTML = '';
  D.bloques.forEach(b => {
    const d = document.createElement('div'); d.className = 'blq ' + (b.who || '');
    let h = `<div class="cab">${(b.who||'mapa')} · ${b.id}${b.silencio?' · 🔇 silencio total':''}</div>`;
    if (b.text) { const t = (ov.text[b.id] ?? b.text); h += `<textarea data-txt="${b.id}" class="${ov.text[b.id] && ov.text[b.id] !== b.text ? 'mod' : ''}">${t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea><div class="mini" data-info="${b.id}"></div>`; } else h += b.intro ? introHTML(b) : b.video ? `<div class="txt">${b.etiqueta || '(vídeo fijo: mapa y rótulo — no se cambia)'}</div><video controls preload="metadata" src="/bvideo/${b.id}" style="height:240px;background:#000"></video>` : '<div class="txt">(sin voz)</div>';
    h += '<div class="shots">' + b.shots.map((s,k) => { const a = fotoActual(b,k), camb = a !== s.a; return `<div class="shot ${camb?'cambiado':''}"><div class="im" data-b="${b.id}" data-k="${k}"><img loading="lazy" src="/thumb/${a}"><span class="id">${k+1}·${a}</span>${s.sc?`<span class="cm">${s.sc}</span>`:''}</div><small>${camb?'cambiada (era '+s.a+')':'tocar para cambiar'}</small>${/^(V|RW)/.test(a)?`<button class="sec" style="width:100%;margin-top:3px;font-size:12px;padding:5px" data-rec="${b.id}|${k}">✂ ${(ov.ss[b.id]||[])[k]!=null && (ov.ss[b.id]||[])[k] !== (s.ss||0) ? 'desde '+(ov.ss[b.id]||[])[k]+' s' : 'Recortar'}</button>`:''}${movHTML(b, s, k, a)}</div>`; }).join('') + '</div>';
    if (b.amb) {
      const cur = ambActual(b);
      h += `<div class="amb">🔊 Ambiente: <select data-amb="${b.id}">${D.audios.map(a=>`<option value="${a.src}" ${a.src===cur?'selected':''}>${a.nombre}</option>`).join('')}${D.audios.some(a=>a.src===cur)?'':`<option selected>${cur}</option>`}</select><audio controls preload="none" src="/audio/${encodeURIComponent((D.audios.find(a=>a.src===cur)||{}).file||'')}"></audio></div>`;
    }
    if (b.text) { const au = ov.audio[b.id]; h += `<div class="amb">🎙 ${au ? `Audio propio: <b>${au}</b> <audio controls preload="none" src="/audio-propio/${encodeURIComponent(au)}"></audio> <button class="sec" data-quitar="${b.id}">Quitar</button>` : `<label class="sec" style="background:#2a2a2a;padding:6px 10px;cursor:pointer;color:#eee">Subir mi audio<input type="file" accept="audio/*" data-sub="${b.id}" hidden></label> <span class="mini">(sustituye a la voz generada)</span>`}</div>`; }
    d.innerHTML = h; $('#lista').appendChild(d);
  });
  document.querySelectorAll('textarea[data-txt]').forEach(e => { const b = D.bloques.find(x=>x.id===e.dataset.txt); const info = () => { const el = document.querySelector(`[data-info="${b.id}"]`); const mod = e.value !== b.text; e.classList.toggle('mod', mod); el.innerHTML = mod ? `<span class="rojo">✏ Texto cambiado (${e.value.length} caracteres) — al montar se genera su voz nueva.</span> <a href="#" data-rev="${b.id}" style="color:#9cf">volver al original</a>` : `${e.value.length} caracteres`; const a = el.querySelector('[data-rev]'); if (a) a.onclick = async ev => { ev.preventDefault(); delete ov.text[b.id]; await guardar(); pintar(); }; }; info(); e.oninput = info; e.onchange = async () => { if (e.value === b.text) delete ov.text[b.id]; else ov.text[b.id] = e.value; await guardar(); pintar(); }; });
  document.querySelectorAll('input[data-sub]').forEach(e => e.onchange = async () => { const f = e.files[0]; if (!f) return; const ext = (f.name.split('.').pop() || '').toLowerCase(); $('#estado').textContent = 'Subiendo audio…'; const r = await fetch(`/api/subir?id=${e.dataset.sub}&ext=${ext}`, { method: 'POST', body: f }); if (!r.ok) { alert('No vale ese formato (usa mp3, wav, m4a…)'); return; } ov = await r.json(); $('#estado').textContent = ''; pintar(); });
  document.querySelectorAll('[data-quitar]').forEach(e => e.onclick = async () => { ov = await (await fetch('/api/quitar-audio?id=' + e.dataset.quitar, { method: 'POST' })).json(); pintar(); });
  cablearMov(); cablearIntro();
  document.querySelectorAll('[data-rec]').forEach(e => e.onclick = () => { const [bid,k] = e.dataset.rec.split('|'); abrirRecorte(bid, +k); });
  document.querySelectorAll('.im').forEach(e => e.onclick = () => abrir(e.dataset.b, +e.dataset.k));
  document.querySelectorAll('select[data-amb]').forEach(e => e.onchange = async () => { const b = D.bloques.find(x=>x.id===e.dataset.amb); if (e.value === b.amb) delete ov.amb[b.id]; else ov.amb[b.id] = e.value; await guardar(); pintar(); });
}
function abrir(bid, k){ ctx = {bid,k}; $('#mt').textContent = `Plano ${k+1} de «${bid}» — elige la foto o clip`; $('#modal').style.display = 'block'; pintarGaleria(); }
// ---- PORTADA por defecto: foto + título + frase + rótulo + encuadre, con vista previa (ffmpeg local, 0 €) ----
function portadaActual(){ return { ...D.portada, ...(ov.portada || {}) }; }
function urlPortada(p){ const f = p.foco || [0.5, 0.5, 0.9]; return '/api/portada?foto=' + encodeURIComponent(p.foto) + '&x=' + f[0] + '&y=' + f[1] + '&h=' + f[2] + '&l1=' + encodeURIComponent(p.l1 || ' ') + '&l2=' + encodeURIComponent(p.l2 || ' ') + '&tag=' + encodeURIComponent(p.tag || ' '); }
let tPortada = null;
function pintarPortada(){
  const P = $('#portada'); if (!D.portada) { P.innerHTML = ''; return; }
  const abierto = P.querySelector('details') && P.querySelector('details').open;
  const p = portadaActual(), f = p.foco || [0.5, 0.5, 0.9];
  const campo = (k, et) => `<label class="mini">${et}<input data-pc="${k}" value="${(p[k] || '').replace(/"/g, '&quot;')}" style="width:100%;background:#0d0d0d;color:#eee;border:1px solid #444;padding:7px;margin:2px 0 6px"></label>`;
  const sl = (i, et, min, max) => `<label class="mini">${et}: <b data-sv="${i}">${f[i]}</b><input type="range" data-ps="${i}" min="${min}" max="${max}" step="0.02" value="${f[i]}" style="width:100%"></label>`;
  P.innerHTML = `<details class="blq" ${abierto ? 'open' : ''} style="border-left-color:#F4630B"><summary class="cab" style="color:var(--or);cursor:pointer">🖼 Portada (primer fotograma del vídeo) — pulsa para abrir</summary><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px"><img id="pimg" style="width:210px;height:373px;background:#000;object-fit:contain"><div style="flex:1;min-width:260px"><button id="pfoto" class="sec" style="margin-bottom:8px">Elegir foto (${p.foto})</button>${campo('l1', 'Título (grande)')}${campo('l2', 'Frase')}${campo('tag', 'Rótulo inferior')}${sl(0, 'Encuadre horizontal', 0, 1)}${sl(1, 'Encuadre vertical', 0, 1)}${sl(2, 'Zoom (menos = más cerca)', 0.5, 1)}<button class="sec" id="prest" style="margin-top:6px">Volver a la portada original</button></div></div></details>`;
  const ver = () => { $('#pimg').src = urlPortada(portadaActual()); };
  const cambiar = nuevo => { ov.portada = { ...portadaActual(), ...nuevo }; ver(); clearTimeout(tPortada); tPortada = setTimeout(guardar, 500); };
  P.querySelectorAll('input[data-pc]').forEach(e => e.oninput = () => cambiar({ [e.dataset.pc]: e.value }));
  P.querySelectorAll('input[data-ps]').forEach(e => e.oninput = () => { const fo = [...(portadaActual().foco || [0.5, 0.5, 0.9])]; fo[+e.dataset.ps] = +e.value; P.querySelector('[data-sv="' + e.dataset.ps + '"]').textContent = e.value; cambiar({ foco: fo }); });
  $('#pfoto').onclick = () => { ctx = { portada: true }; $('#mt').textContent = 'Elige la foto de la portada (solo fotos)'; $('#modal').style.display = 'block'; pintarGaleria(portadaActual().foto); };
  $('#prest').onclick = async () => { ov.portada = {}; await guardar(); pintarPortada(); };
  ver();
}
// ---- Movimiento (Ken Burns) por foto y ajustes del vídeo: todo COLAPSADO; lo automático lo decide el montaje ----
function movActual(bid, k){ return ((ov.mov || {})[bid] || [])[k] || {}; }
function movHTML(b, s, k, a){
  if (/^(V|RW)/.test(a)) return '';
  const m = movActual(b.id, k), opt = (v, t, cur) => `<option value="${v}" ${String(cur ?? '') === v ? 'selected' : ''}>${t}</option>`;
  return `<details class="mov"><summary>⚙ Movimiento${(m.dir || m.z != null || m.foc) ? ' ✎' : ''}</summary>
    <label class="mini">Tipo<select data-mdir="${b.id}|${k}">${opt('', 'Auto', m.dir)}${opt('in', 'Acercar', m.dir)}${opt('out', 'Alejar', m.dir)}${opt('quieta', 'Quieta', m.dir)}</select></label>
    <label class="mini">Fuerza<select data-mz="${b.id}|${k}">${opt('', 'Auto', m.z)}${opt('0.05', 'Suave', m.z)}${opt('0.09', 'Media', m.z)}${opt('0.15', 'Fuerte', m.z)}</select></label>
    <button class="sec" style="width:100%;font-size:12px;padding:5px;margin-top:3px" data-menf="${b.id}|${k}">🎯 Punto de enfoque${m.foc ? ' (fijado)' : ''}</button></details>`;
}
function guardarMov(bid, k, cambio){
  const b = D.bloques.find(x => x.id === bid); ov.mov = ov.mov || {}; const arr = ov.mov[bid] || (ov.mov[bid] = b.shots.map(() => null));
  const nuevo = { ...(arr[k] || {}), ...cambio }; Object.keys(nuevo).forEach(x => { if (nuevo[x] === undefined || nuevo[x] === '' || nuevo[x] === null) delete nuevo[x]; });
  arr[k] = Object.keys(nuevo).length ? nuevo : null; if (arr.every(x => !x)) delete ov.mov[bid];
  guardar();
}
function cablearMov(){
  document.querySelectorAll('select[data-mdir]').forEach(e => e.onchange = () => { const [b, k] = e.dataset.mdir.split('|'); guardarMov(b, +k, { dir: e.value }); });
  document.querySelectorAll('select[data-mz]').forEach(e => e.onchange = () => { const [b, k] = e.dataset.mz.split('|'); guardarMov(b, +k, { z: e.value ? +e.value : null }); });
  document.querySelectorAll('[data-menf]').forEach(e => e.onclick = () => { const [b, k] = e.dataset.menf.split('|'); abrirEnfoque(b, +k); });
}
function abrirEnfoque(bid, k){
  const b = D.bloques.find(x => x.id === bid), id = fotoActual(b, k), cx = b.shots[k].cx ?? 0.5, m = movActual(bid, k), im = $('#fimg'), mk = $('#fmark');
  $('#ft').textContent = `Punto de enfoque · «${bid}», plano ${k+1} (${id}) — toca lo que importa: el zoom termina ahí`;
  im.src = '/api/recorte?id=' + id + '&cx=' + cx; const f = m.foc || b.shots[k].foc;
  const marca = (x, y) => { mk.style.display = 'block'; mk.style.left = (x * 100) + '%'; mk.style.top = (y * 100) + '%'; };
  if (f) marca(f[0], f[1]); else mk.style.display = 'none';
  im.onclick = ev => { const r = im.getBoundingClientRect(), x = Math.round((ev.clientX - r.left) / r.width * 100) / 100, y = Math.round((ev.clientY - r.top) / r.height * 100) / 100; marca(x, y); guardarMov(bid, k, { foc: [x, y] }); pintar(); };
  $('#fauto').onclick = () => { mk.style.display = 'none'; guardarMov(bid, k, { foc: null }); pintar(); };
  $('#modal3').style.display = 'block';
}
function pintarAjustes(){
  const P = $('#ajustes'), abierto = P.querySelector('details') && P.querySelector('details').open;
  const sg = { ...(D.seguir || {}), ...(ov.seguir || {}) };
  P.innerHTML = `<details class="blq" ${abierto ? 'open' : ''} style="border-left-color:#888"><summary class="cab" style="cursor:pointer">⚙ Ajustes del vídeo (aviso de seguir, cierre) — pulsa para abrir</summary>
    <label class="mini" style="display:block;margin-top:8px"><input type="checkbox" id="sg-on" ${sg.activo !== false ? 'checked' : ''}> Aviso sutil de «me gusta / seguir» durante el vídeo</label>
    <label class="mini">Aparece en el segundo <input type="number" id="sg-seg" min="3" max="120" step="1" value="${sg.seg ?? 30}" style="width:70px;background:#0d0d0d;color:#eee;border:1px solid #444;padding:5px"></label>
    <label class="mini" style="display:block">Texto <input id="sg-txt" value="${(sg.texto || 'Si te está gustando, sígueme').replace(/"/g, '&quot;')}" style="width:100%;background:#0d0d0d;color:#eee;border:1px solid #444;padding:7px"></label>
    <div class="mini" style="margin-top:6px">El cierre (título de la serie y descarga de la app) y el movimiento de las fotos los pone el montaje solo; el movimiento de cada foto se retoca en su «⚙ Movimiento».</div></details>`;
  let t = null; const cambia = () => { ov.seguir = { activo: $('#sg-on').checked, seg: +$('#sg-seg').value || 30, texto: $('#sg-txt').value }; clearTimeout(t); t = setTimeout(guardar, 500); };
  ['#sg-on', '#sg-seg', '#sg-txt'].forEach(s => { $(s).oninput = cambia; $(s).onchange = cambia; });
}
// ---- INTRO editable: clip (galería), dónde empieza, cuánto dura y los sonidos (grito, ataque, golpe real…) con su momento y volumen ----
function introActual(b){ return { ...b.intro, ...((ov.intro) || {}) }; }
function introHTML(b){
  const I = introActual(b), sd = D.sonidosDisp || [];
  const filas = (I.sonidos || []).map((s, i) => `<tr><td><select data-isnd="${i}">${sd.map(x => `<option value="${x.id}" ${x.id === s.src ? 'selected' : ''}>${x.nombre}</option>`).join('')}</select></td>
    <td><input type="number" step="0.1" min="0" max="30" data-iat="${i}" value="${s.at ?? 0}"></td>
    <td><input type="number" step="1" min="-30" max="6" data-idb="${i}" value="${s.db ?? 0}"></td>
    <td><input type="number" step="0.1" min="0" max="20" data-iss="${i}" value="${s.ss ?? 0}"></td>
    <td><audio controls preload="none" src="/sfx/${encodeURIComponent((sd.find(x => x.id === s.src) || {}).archivo || '')}" style="height:30px;width:170px"></audio></td>
    <td><button class="sec" data-iquita="${i}" style="padding:4px 9px" title="Quitar este sonido">✕</button></td></tr>`).join('');
  const rec = ((I.ss || 0) > 0 || I.fin) ? `desde ${I.ss || 0} s${I.fin ? ' hasta ' + I.fin + ' s' : ''}` : 'Recortar';
  return `<div class="txt">${b.etiqueta || ''}</div>
    <div class="shots"><div class="shot" style="width:150px"><video controls preload="metadata" src="/media/${I.clip}" style="width:150px;background:#000"></video>
      <button class="sec" id="irec" style="width:100%;margin-top:3px;font-size:12px;padding:5px">✂ ${rec}</button>
      <button class="sec" id="iclip" style="width:100%;margin-top:3px;font-size:12px;padding:5px">🎞 Cambiar clip (${I.clip})</button></div></div>
    <div class="mini" style="margin-top:4px">Al recortar el clip, el vídeo y los sonidos se recortan a la vez: los sonidos van pegados a la imagen.</div>
    <details class="blq-in" style="margin:6px 0"><summary style="cursor:pointer;color:var(--mu);font-size:13px">⚙ Sonidos de la intro (grito, ataque…) — pulsa para abrir</summary>
      <label class="mini" style="display:block;margin:8px 0">Volumen general (dB) <input type="number" step="1" min="-30" max="6" id="igain" value="${I.gainAudio ?? -5}" style="width:70px"></label>
      <table class="tsnd"><thead><tr><th>Sonido</th><th>Empieza en el seg. del clip</th><th>Volumen (dB)</th><th>Saltar el principio (s)</th><th>Oír</th><th></th></tr></thead><tbody>${filas}</tbody></table>
      <button id="iadd" class="sec" style="margin-top:8px">+ Añadir sonido</button>
      <div class="mini" style="margin-top:6px">Un grito o un golpe nuevo con IA se genera aparte (ElevenLabs, ~100 créditos cada uno): dímelo y lo añado a esta lista.</div></details>`;
}
function abrirRecorteIntro(bid){
  const b = D.bloques.find(x => x.id === bid), I = introActual(b), v = $('#rvid');
  $('#rt').textContent = `Recortar la intro (${I.clip}) — el clip original no se toca; vídeo y sonidos se recortan juntos`;
  $('#rpon').textContent = '✂ Empezar aquí'; $('#rorig').textContent = 'Quitar el recorte'; $('#rfin').style.display = 'inline-block';
  v.src = '/media/' + I.clip; v.onloadedmetadata = () => { v.currentTime = I.ss || 0; };
  const info = () => { const x = introActual(b); $('#rinfo').textContent = 'Empieza en ' + (x.ss || 0).toFixed(1) + ' s' + (x.fin ? ' · termina en ' + x.fin.toFixed(1) + ' s' : ' · termina al final del clip'); }; info();
  $('#rpon').onclick = async () => { const t = Math.round(v.currentTime * 10) / 10; ov.intro = { ...introActual(b), ss: t }; await guardar(); info(); pintar(); };
  $('#rfin').onclick = async () => { const t = Math.round(v.currentTime * 10) / 10; ov.intro = { ...introActual(b), fin: t }; await guardar(); info(); pintar(); };
  $('#rorig').onclick = async () => { ov.intro = { ...introActual(b), ss: 0, fin: null }; await guardar(); v.currentTime = 0; info(); pintar(); };
  $('#modal2').style.display = 'block';
}
function guardarIntro(b, cambio){ ov.intro = { ...introActual(b), ...cambio }; clearTimeout(guardarIntro.t); guardarIntro.t = setTimeout(guardar, 400); }
function cablearIntro(){
  D.bloques.filter(b => b.intro).forEach(b => {
    const I = () => introActual(b), snd = fn => { const s = [...(I().sonidos || []).map(x => ({ ...x }))]; fn(s); guardarIntro(b, { sonidos: s }); };
    const num = (id, k) => { const e = document.getElementById(id); if (e) e.oninput = () => guardarIntro(b, { [k]: +e.value }); };
    num('igain', 'gainAudio');
    const br = document.getElementById('irec'); if (br) br.onclick = () => abrirRecorteIntro(b.id);
    const bc = document.getElementById('iclip'); if (bc) bc.onclick = () => { ctx = { intro: b.id }; $('#mt').textContent = 'Elige el clip de la intro (vídeos y Runway)'; $('#modal').style.display = 'block'; tab = 'runway'; pintarGaleria(I().clip); };
    document.querySelectorAll('select[data-isnd]').forEach(e => e.onchange = () => snd(s => { s[+e.dataset.isnd].src = e.value; }));
    document.querySelectorAll('input[data-iat]').forEach(e => e.oninput = () => snd(s => { s[+e.dataset.iat].at = +e.value; }));
    document.querySelectorAll('input[data-idb]').forEach(e => e.oninput = () => snd(s => { s[+e.dataset.idb].db = +e.value; }));
    document.querySelectorAll('input[data-iss]').forEach(e => e.oninput = () => snd(s => { s[+e.dataset.iss].ss = +e.value; }));
    document.querySelectorAll('[data-iquita]').forEach(e => e.onclick = () => { snd(s => s.splice(+e.dataset.iquita, 1)); pintar(); });
    const ba = document.getElementById('iadd'); if (ba) ba.onclick = () => { snd(s => s.push({ src: (D.sonidosDisp[0] || {}).id, at: 0, db: 0, ss: 0 })); pintar(); };
  });
}
function pestanas(){
  const T = {}; const grupos = [...new Set(D.galeria.sony.map(id => Math.floor(+id.slice(1) / 100)))];
  grupos.forEach(h => { T['sony' + h] = 'Sony ' + (h * 100) + '-' + (h * 100 + 99); });
  T.movil = 'Fotos móvil'; T.video = 'Vídeos'; T.runway = 'Runway'; return T;
}
function lista(t){ return t.startsWith('sony') ? D.galeria.sony.filter(id => Math.floor(+id.slice(1) / 100) === +t.slice(4)) : D.galeria[t]; }
function pintarGaleria(foco){
  const T = pestanas(); if (!T[tab]) tab = Object.keys(T)[0];
  if (foco) { const g = foco.startsWith('S') ? 'sony' + Math.floor(+foco.slice(1) / 100) : foco.startsWith('M') ? 'movil' : foco.startsWith('RW') ? 'runway' : 'video'; if (T[g]) tab = g; }
  $('#tabs').innerHTML = Object.keys(T).map(t => `<button class="${t===tab?'on':''}" data-t="${t}">${T[t]}</button>`).join('') + '<input id="ir" placeholder="ir al nº (ej. 465)" style="width:150px;margin-left:8px;background:#222;color:#eee;border:1px solid #555;padding:7px">';
  $('#tabs').querySelectorAll('button').forEach(e => e.onclick = () => { tab = e.dataset.t; pintarGaleria(); });
  $('#ir').oninput = e => { let n = e.target.value.trim().toUpperCase(); if (/^[0-9]+$/.test(n)) n = 'S' + n; if (/^[SM][0-9]+$/.test(n) && (D.galeria.sony.includes(n) || D.galeria.movil.includes(n))) { pintarGaleria(n); const el = $('#grid').querySelector('[data-id="' + n + '"]'); if (el) { el.scrollIntoView({block:'center'}); el.style.outline = '3px solid #f0f'; } $('#ir').value = n; $('#ir').focus(); } };
  const usadas = {}; D.bloques.forEach(b => b.shots.forEach((s,k) => { const a = fotoActual(b,k); usadas[a] = (usadas[a] ? usadas[a] + ', ' : '') + b.id + ' ' + (k+1); }));
  const aqui = ctx.portada ? portadaActual().foto : ctx.intro ? introActual(D.bloques.find(x => x.id === ctx.intro)).clip : fotoActual(D.bloques.find(x => x.id === ctx.bid), ctx.k);
  $('#grid').innerHTML = '<div class="leyenda" style="grid-column:1/-1"><b style="background:#fc0">AMARILLO</b> el de este plano · <b style="background:#3c3">VERDE</b> ya está puesto en otro plano (verás dónde) · sin color: libre</div>' + lista(tab).map(id => `<div class="g ${id===aqui?'aqui':usadas[id]?'usada':''}" data-id="${id}"><img loading="lazy" src="/thumb/${id}"><span>${id}</span>${usadas[id]?`<div class="u">${id===aqui?'este plano':'en '+usadas[id]}</div>`:''}</div>`).join('');
  $('#grid').querySelectorAll('.g[data-id]').forEach(e => e.onclick = async () => {
    if (ctx.portada) { if (/^(V|RW)/.test(e.dataset.id)) return; ov.portada = { ...portadaActual(), foto: e.dataset.id }; await guardar(); $('#modal').style.display = 'none'; pintarPortada(); return; }
    if (/^(V|RW)/.test(e.dataset.id)) return previsualizarVideo(e.dataset.id);
    const b = D.bloques.find(x => x.id === ctx.bid); const arr = ov.shots[b.id] || (ov.shots[b.id] = b.shots.map(s => s.a)); arr[ctx.k] = e.dataset.id;
    if (arr.every((a,i) => a === b.shots[i].a)) delete ov.shots[b.id];
    await guardar(); $('#modal').style.display = 'none'; pintar();
  });
}
// Desde la galería: al tocar un vídeo se ve ahí mismo y se elige dónde empieza antes de ponerlo en el plano
function previsualizarVideo(id){
  $('#rfin').style.display = 'none';
  if (ctx.intro) { const bi = D.bloques.find(x => x.id === ctx.intro), v = $('#rvid'); $('#rt').textContent = `Clip ${id} para la intro — pausa donde quieras que EMPIECE`; v.src = '/media/' + id; v.onloadedmetadata = () => { v.currentTime = 0; v.play(); }; $('#rinfo').textContent = ''; $('#rpon').textContent = '✔ Usar este clip empezando aquí'; $('#rorig').textContent = '← Elegir otro';
    $('#rpon').onclick = async () => { const t = Math.round(v.currentTime * 10) / 10; v.pause(); ov.intro = { ...introActual(bi), clip: id, ss: t }; await guardar(); $('#modal2').style.display = 'none'; $('#modal').style.display = 'none'; pintar(); };
    $('#rorig').onclick = () => { v.pause(); $('#modal2').style.display = 'none'; }; $('#modal2').style.display = 'block'; return; }
  const bid = ctx.bid, k = ctx.k, b = D.bloques.find(x => x.id === bid), v = $('#rvid');
  $('#rt').textContent = `Vídeo ${id} para «${bid}», plano ${k+1} — pausa donde quieras que EMPIECE`;
  v.src = '/media/' + id; v.onloadedmetadata = () => { v.currentTime = 0; v.play(); }; $('#rinfo').textContent = '';
  $('#rpon').textContent = '✔ Usar este vídeo empezando aquí'; $('#rorig').textContent = '← Elegir otro';
  $('#rpon').onclick = async () => {
    const t = Math.round(v.currentTime * 10) / 10; v.pause();
    const arr = ov.shots[bid] || (ov.shots[bid] = b.shots.map(s => s.a)); arr[k] = id;
    if (arr.every((a,i) => a === b.shots[i].a) && !(t > 0)) delete ov.shots[bid];
    const ss = ov.ss[bid] || (ov.ss[bid] = b.shots.map(s => s.ss || 0)); ss[k] = t;
    await guardar(); $('#modal2').style.display = 'none'; $('#modal').style.display = 'none'; pintar();
  };
  $('#rorig').onclick = () => { v.pause(); $('#modal2').style.display = 'none'; };
  $('#modal2').style.display = 'block';
}
function abrirRecorte(bid, k){
  $('#rfin').style.display = 'none';
  $('#rpon').textContent = '✂ Empezar aquí (donde está el vídeo)'; $('#rorig').textContent = 'Volver al original';
  const b = D.bloques.find(x => x.id === bid), id = fotoActual(b, k), ss0 = ((ov.ss[bid] || [])[k] ?? b.shots[k].ss) || 0;
  $('#rt').textContent = `Recortar «${bid}», plano ${k+1} (${id}) — el vídeo original no se toca`;
  const v = $('#rvid'); v.src = '/media/' + id; v.onloadedmetadata = () => { v.currentTime = ss0; }; $('#rinfo').textContent = 'Empieza en: ' + ss0.toFixed(1) + ' s';
  $('#rpon').onclick = async () => { const t = Math.round(v.currentTime * 10) / 10; const arr = ov.ss[bid] || (ov.ss[bid] = b.shots.map(s => s.ss || 0)); arr[k] = t; if (arr.every((x,i) => x === (b.shots[i].ss || 0))) delete ov.ss[bid]; await guardar(); $('#rinfo').textContent = '✔ Empieza en ' + t.toFixed(1) + ' s'; pintar(); };
  $('#rorig').onclick = async () => { const arr = ov.ss[bid]; if (arr) { arr[k] = b.shots[k].ss || 0; if (arr.every((x,i) => x === (b.shots[i].ss || 0))) delete ov.ss[bid]; await guardar(); } v.currentTime = b.shots[k].ss || 0; $('#rinfo').textContent = 'Vuelto al original'; pintar(); };
  $('#modal2').style.display = 'block';
}
$('#fcerrar').onclick = () => { $('#modal3').style.display = 'none'; };
$('#rcerrar').onclick = () => { $('#rvid').pause(); $('#modal2').style.display = 'none'; };
$('#cerrar').onclick = () => $('#modal').style.display = 'none';
$('#reset').onclick = async () => { const b = $('#reset'); if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { b.dataset.seguro = ''; b.textContent = 'Deshacer cambios'; }, 4000); return; } b.dataset.seguro = ''; b.textContent = 'Deshacer cambios'; ov = await (await fetch('/api/reset', {method:'POST'})).json(); pintar(); };
// Sin ventanas emergentes (el navegador las puede bloquear y el botón parecía muerto): si hay voces nuevas, el aviso del coste sale en la propia página y se confirma pulsando OTRA VEZ.
let montarArmado = null;
$('#montar').onclick = async () => {
  await guardar(); const b = $('#montar'), est = await (await fetch('/api/estimar')).json();
  if (est.chars > 0 && !montarArmado) {
    b.textContent = '⚠ Pulsa otra vez para montar'; const m = $('#mini'); m.style.display = 'block'; $('#minib').style.width = '0';
    $('#minit').textContent = `Voces nuevas: ${est.bloques.join(', ')} → ${est.chars} caracteres ≈ ${est.chars} créditos de ElevenLabs (~${Math.max(1, Math.round(est.chars * 0.022))} céntimos). Pulsa «Montar» otra vez para confirmar.`;
    montarArmado = setTimeout(() => { montarArmado = null; b.textContent = '▶ Montar'; $('#minit').textContent = ''; }, 12000); return;
  }
  clearTimeout(montarArmado); montarArmado = null; b.textContent = '▶ Montar';
  await fetch('/api/montar', { method: 'POST' }); sondear();
};
const PASOS = ['Voces','Línea de tiempo','Cortando y revelando planos','Subtítulos y cifras','Mezcla de audio','Montaje final'];
async function sondear(){
  const r = await (await fetch('/api/estado')).json(), P = $('#panel');
  $('#montar').disabled = r.estado === 'montando';
  { const pct0 = r.estado === 'listo' ? 100 : Math.min(97, Math.round(((r.etapa-1) + (r.etapa===3 && r.total ? r.plano/r.total : 0)) / 6 * 100)); const m = $('#mini'); m.style.display = r.estado === 'libre' ? 'none' : 'block'; $('#minib').style.width = pct0 + '%'; $('#minit').textContent = r.estado === 'montando' ? '⏳ MONTANDO ' + pct0 + '% · paso ' + r.etapa + '/6' + (r.etapa === 3 && r.total ? ' · plano ' + r.plano + '/' + r.total : '') + ' · ' + Math.floor(r.seg/60) + ':' + String(r.seg%60).padStart(2,'0') : r.estado === 'listo' ? '✅ MONTADO — mira «Compara»' : '❌ ERROR — mira el panel'; }
  if (r.estado !== 'libre') {
    const t = Math.floor(r.seg/60) + ' min ' + (r.seg%60) + ' s';
    const pct = r.estado === 'listo' ? 100 : Math.min(97, Math.round(((r.etapa-1) + (r.etapa===3 && r.total ? r.plano/r.total : 0)) / 6 * 100));
    const cam = r.cambios.length ? '<ul>' + r.cambios.map(c=>'<li>'+c+'</li>').join('') + '</ul>' : '<div class="mini">Sin cambios: se monta igual que el original.</div>';
    P.style.display = 'block';
    P.innerHTML = (r.estado==='montando' ? '<b style="color:var(--or)">⏳ MONTANDO · ' + t + '</b>' : r.estado==='listo' ? '<b style="color:#6c6">✅ MONTADO en ' + t + ' — míralo abajo</b>' : '<b style="color:#e55">❌ ERROR</b>')
      + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      + '<ol>' + PASOS.map((p,i)=>'<li class="'+(r.estado==='listo'||i+1<r.etapa?'hecho':i+1===r.etapa?'ahora':'')+'">'+(r.estado==='listo'||i+1<r.etapa?'✓ ':i+1===r.etapa?'▶ ':'')+p+(i===2&&r.etapa===3&&r.total?' ('+r.plano+' de '+r.total+')':'')+'</li>').join('') + '</ol>'
      + '<b>Cambios que se aplican en este montaje:</b>' + cam
      + (r.estado==='error' ? '<pre>'+r.log.slice(-500)+'</pre>' : r.log ? '<pre>'+r.log.split('\n').filter(x=>/aviso|⚠|ℹ|Caracteres/.test(x)).join('\n')+'</pre>' : '');
  }
  if (r.tieneVideo && r.estado !== 'montando') { $('#vid').style.display = 'block'; const v = $('#vnuevo'), u = '/video?t=' + (r.fin||0); if (!v.src.endsWith(u)) { v.src = u; } if (r.tieneOriginal && !$('#vold').src) $('#vold').src = '/video-original'; if (r.estado==='listo') P.scrollIntoView({behavior:'smooth'}); }
  if (r.estado === 'montando') setTimeout(sondear, 1500);
}
(async () => { D = await (await fetch('/api/datos')).json(); document.querySelector('h1').textContent = 'EDITOR · ' + D.titulo; document.title = 'Editor · ' + D.titulo; ov = D.overrides; pintar(); sondear(); })();
</script></body></html>
