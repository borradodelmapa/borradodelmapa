/* Muestra del motor de vídeo NUEVO (v2, 30 sept 2026): mapa vectorial propio (Protomaps) + RELIEVE 3D propio
   (terreno en R2), cámara de dron pegada a la moto, MOTO 3D hecha en código (three.js) y fotos en tarjetas grandes.
   Todo alojado en nuestro servidor (vendor/mapa) y en nuestra nube (R2). Página suelta, no enlazada. */
:root{--ink:#0D0F10;--line:#2B2E30;--cream:#ECEBE8;--muted:#9A9EA1;--gold:#F4630B;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--cream);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 12px 24px}
.stage{position:relative;width:360px;height:640px;transform-origin:top center;background:#9fd3f0;overflow:hidden}
#map,#ov{position:absolute;inset:0;width:360px;height:640px}
#ov{pointer-events:none}
.bar{display:flex;gap:10px;align-items:center;width:min(360px,100%)}
.btn{appearance:none;border:0;cursor:pointer;min-height:46px;padding:0 16px;background:var(--gold);color:#0D0F10;font:700 16px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--cream);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.play{width:46px;padding:0;font-size:18px}
.prog{flex:1;height:4px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--gold)}
.note{font-size:13px;color:var(--muted);width:min(360px,100%);text-align:center;margin:0}
.res{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.res video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.res .row{display:flex;gap:8px;padding:10px 12px;background:var(--ink)}
.res .row .btn{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none}
.res .x{position:absolute;top:10px;right:10px;width:44px;height:44px;background:var(--ink);border:1px solid var(--line);color:var(--cream);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><div id="map"></div><canvas id="ov" width="720" height="1280"></canvas></div>
  <div class="bar"><button class="btn play" id="play" type="button" aria-label="Reproducir" disabled>▶</button><div class="prog"><i id="pbar"></i></div></div>
  <div class="bar"><button class="btn" id="mp4" type="button" style="flex:1" disabled>Crear el vídeo (MP4)</button></div>
  <p class="note" id="note">Cargando el mapa…</p>
</div>

<script src="/vendor/mapa/maplibre-gl.js"></script>
<script src="/vendor/mapa/pmtiles.js"></script>
<script src="/vendor/mapa/basemaps.js"></script>
<script src="/vendor/mapa/mp4-muxer.js"></script>
<script type="module">
import * as THREE from '/vendor/mapa/three/three.module.js';
const $=s=>document.querySelector(s);
const API='https://salma-api.borradodelmapa-api.workers.dev';
const W=720,H=1280,PR=2,FPS=30;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,eout=t=>1-Math.pow(1-t,3),smooth=t=>t*t*(3-2*t);
const eback=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const hav=(a,b)=>{const r=Math.PI/180,dl=(b[1]-a[1])*r,dg=(b[0]-a[0])*r;const x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(x));};

/* ── estilo: postal con colores vivos + relieve sombreado + montañas en 3D ── */
const flavor=Object.assign({},basemaps.namedFlavor('light'),{
  background:'#e9f2dc',earth:'#eef3df',water:'#5fb8ea',
  park_a:'#b9e39a',park_b:'#8fd46a',wood_a:'#a9dc86',wood_b:'#7ec85a',scrub_a:'#c7e8a8',scrub_b:'#a4da7c',
  sand:'#f5e6b8',beach:'#f7e3a6',glacier:'#ffffff',
  highway:'#ffc94d',highway_casing_early:'#e0a12c',highway_casing_late:'#e0a12c',
  major:'#ffe7a3',major_casing_early:'#dcbc6d',major_casing_late:'#dcbc6d',
  minor_a:'#ffffff',minor_b:'#ffffff',minor_casing:'#d3ccb8',link:'#ffe7a3',
  city_label:'#1f1b17',city_label_halo:'#ffffff',subplace_label:'#3f3a33',subplace_label_halo:'#ffffff',
  roads_label_major:'#5e574e',roads_label_minor:'#6d665c',ocean_label:'#1f6aa6',
  buildings:'#e5dccb',boundaries:'#b19f7e'});
const protocol=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',protocol.tile);
const layers=basemaps.layers('protomaps',flavor,{lang:'es'});
// sombreado del relieve justo encima del suelo (antes del agua y las carreteras)
const iWater=layers.findIndex(l=>l.id==='water');
layers.splice(iWater<0?2:iWater,0,{id:'relieve',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.55,'hillshade-shadow-color':'#4b5a3a','hillshade-highlight-color':'#ffffff','hillshade-accent-color':'#6e7f52'}});
const style={version:8,
  glyphs:location.origin+'/vendor/mapa/fonts/{fontstack}/{range}.pbf',
  sprite:location.origin+'/vendor/mapa/sprites/light',
  sources:{
    protomaps:{type:'vector',url:'pmtiles://'+API+'/mapas/cantabria-asturias.pmtiles',attribution:'© OpenStreetMap'},
    dem:{type:'raster-dem',tiles:[API+'/terreno/terreno-cantabria-asturias/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:12}},
  sky:{'sky-color':'#8fcdf2','horizon-color':'#dcefff','fog-color':'#eaf4ff','sky-horizon-blend':.6,'horizon-fog-blend':.7,'fog-ground-blend':.85},
  terrain:{source:'dem',exaggeration:1.35},
  layers};

let R=null,map=null,ov=$('#ov'),g=ov.getContext('2d'),cum=[],PH=[],TL=null;

/* ── recorrido ── */
function prepRoute(){const c=R.coords;cum=[0];for(let i=1;i<c.length;i++)cum.push(cum[i-1]+hav(c[i-1],c[i]));R.total=cum[cum.length-1];R.paradas.forEach(p=>p.km=cum[p.i]);}
function posAt(km){km=clamp(km,0,R.total);let lo=0,hi=cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=km)lo=m;else hi=m;}
  const f=cum[hi]===cum[lo]?0:(km-cum[lo])/(cum[hi]-cum[lo]);const a=R.coords[lo],b=R.coords[hi];return[lerp(a[0],b[0],f),lerp(a[1],b[1],f)];}
function bearingOf(a,b){const r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return Math.atan2(y,x)/r;}
const headingAt=(km,back=.3,ahead=.6)=>bearingOf(posAt(km-back),posAt(km+ahead));       // rumbo de la moto
const camHeadingAt=km=>bearingOf(posAt(km-1),posAt(km+2.5));                             // rumbo de la cámara (suave)
function angLerp(a,b,t){const d=((b-a+540)%360)-180;return a+d*t;}
// zoom para ver 'km' kilómetros de ancho en la pantalla (360 px CSS)
const zoomForKm=(km,lat)=>Math.log2(40075*Math.cos(lat*Math.PI/180)*360/(512*km));

/* ── guion ── */
const Z_NEAR_KM=1.1,PITCH=55; // v3: el mapa no gira (norte arriba); solo la moto gira
function buildTimeline(){
  const segs=[];let t=0;const add=s=>{s.t0=t;t+=s.dur;segs.push(s);};
  add({k:'intro',dur:2.8});add({k:'bajar',dur:2.6});
  R.paradas.forEach((p,i)=>{
    const n=(PH[i]||[]).length;add({k:'parada',dur:1.2+n*1.05,p,i,n});
    const q=R.paradas[i+1];if(!q)return;const km=q.km-p.km;
    add({k:'tramo',dur:clamp(4+Math.sqrt(Math.abs(km))*.75,5,11),a:p.km,b:q.km,i});
  });
  add({k:'cierre',dur:4});
  return{segs,total:t};
}
let overview=null;
function camAt(t){
  const s=TL.segs.find(x=>t<x.t0+x.dur)||TL.segs[TL.segs.length-1],lt=clamp((t-s.t0)/s.dur,0,1);
  const zN=km=>zoomForKm(Z_NEAR_KM,posAt(km)[1]);
  if(s.k==='intro')return{c:overview.center,z:overview.zoom,b:0,p:0,km:0,veh:false,s,lt};
  if(s.k==='bajar'){const e=ease(lt),c=posAt(0);return{c:[lerp(overview.center[0],c[0],e),lerp(overview.center[1],c[1],e)],z:lerp(overview.zoom,zN(0),e),b:0,p:lerp(0,PITCH,e),km:0,veh:e>.55,s,lt};}
  if(s.k==='parada'){const c=posAt(s.p.km);return{c,z:zN(s.p.km),b:0,p:PITCH,km:s.p.km,veh:true,s,lt};}
  if(s.k==='tramo'){const e=smooth(lt),km=lerp(s.a,s.b,e),len=Math.abs(s.b-s.a),c=posAt(km);
    // solo en tramos largos la cámara sube un poco a mitad de camino, y muy suave (sin tirones)
    const hump=len>15?smooth(Math.sin(Math.PI*lt)):0,zFar=zoomForKm(clamp(len*.2,Z_NEAR_KM,25),c[1]),z=lerp(zN(km),Math.min(zN(km),zFar),hump);
    return{c,z,b:0,p:PITCH,km,veh:true,s,lt};}
  const e=ease(Math.min(1,lt*1.3)),c=posAt(R.total);return{c:[lerp(c[0],overview.center[0],e),lerp(c[1],overview.center[1],e)],z:lerp(zN(R.total),overview.zoom,e),b:0,p:lerp(PITCH,0,e),km:R.total,veh:e<.35,s,lt};
}

/* ── MOTO 3D hecha en código (sin modelos de terceros): moto naranja de la marca con piloto ── */
function buildMoto(){
  const grp=new THREE.Group(),m=(c,r=.5,mt=.1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:mt});
  const orange=m(0xF4630B,.45,.15),black=m(0x16181a,.6),chrome=m(0xcfd3d6,.25,.8),skin=m(0xe0b48f,.7),jacket=m(0x23262a,.7),helmet=m(0xffffff,.3,.1);
  const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=true;grp.add(o);return o;};
  // ruedas (eje X = lateral, Z = hacia delante, Y = arriba)
  const wheel=new THREE.TorusGeometry(.34,.11,12,28);add(wheel,black,0,.45,.72,0,Math.PI/2,0);add(wheel,black,0,.45,-.72,0,Math.PI/2,0);
  const rim=new THREE.CylinderGeometry(.2,.2,.08,18);add(rim,chrome,0,.45,.72,0,0,Math.PI/2);add(rim,chrome,0,.45,-.72,0,0,Math.PI/2);
  add(new THREE.BoxGeometry(.28,.34,1.05),black,0,.62,0);                       // motor / chasis
  add(new THREE.BoxGeometry(.42,.3,.62),orange,0,.98,.22,-.12,0,0);              // depósito
  add(new THREE.BoxGeometry(.34,.14,.7),black,0,.95,-.36);                       // asiento
  add(new THREE.BoxGeometry(.3,.22,.5),orange,0,.86,-.72,.18,0,0);               // colín
  add(new THREE.CylinderGeometry(.045,.045,.95,10),chrome,0,.95,.62,.45,0,0);    // horquilla
  add(new THREE.CylinderGeometry(.035,.035,.78,10),black,0,1.33,.48,0,0,Math.PI/2); // manillar
  add(new THREE.BoxGeometry(.32,.22,.12),orange,0,1.18,.72,-.35,0,0);            // cúpula
  add(new THREE.CylinderGeometry(.06,.07,.55,10),chrome,.2,.55,-.45,Math.PI/2,0,0); // escape
  // piloto
  add(new THREE.BoxGeometry(.46,.62,.32),jacket,0,1.42,-.16,.35,0,0);            // torso inclinado
  add(new THREE.SphereGeometry(.2,18,14),helmet,0,1.86,.02);                     // casco
  add(new THREE.BoxGeometry(.3,.1,.08),black,0,1.86,.19);                        // visera
  const arm=new THREE.CylinderGeometry(.07,.07,.55,8);add(arm,jacket,.2,1.46,.2,1.1,0,0);add(arm,jacket,-.2,1.46,.2,1.1,0,0);
  const leg=new THREE.CylinderGeometry(.09,.08,.6,8);add(leg,jacket,.22,.95,-.1,1.2,0,0);add(leg,jacket,-.22,.95,-.1,1.2,0,0);
  add(new THREE.BoxGeometry(.12,.1,.12),skin,.2,1.36,.46);add(new THREE.BoxGeometry(.12,.1,.12),skin,-.2,1.36,.46); // guantes
  // sombra en el suelo
  const sh=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.scale.set(.55,1.25,1);sh.position.y=.02;grp.add(sh);
  return grp;
}
const moto={pos:[0,0],heading:0,visible:false};
const motoLayer={id:'moto3d',type:'custom',renderingMode:'3d',
  onAdd(map,gl){this.map=map;this.camera=new THREE.Camera();this.scene=new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a55,1.6));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-3,8,4);this.scene.add(sun);
    this.obj=buildMoto();this.scene.add(this.obj);
    this.renderer=new THREE.WebGLRenderer({canvas:map.getCanvas(),context:gl,antialias:true});this.renderer.autoClear=false;},
  render(gl,args){
    if(!moto.visible)return;
    const mm=args&&args.defaultProjectionData?args.defaultProjectionData.mainMatrix:args;
    const elev=(this.map.queryTerrainElevation&&this.map.queryTerrainElevation(moto.pos))||0;
    const mc=maplibregl.MercatorCoordinate.fromLngLat(moto.pos,elev);
    // tamaño "de dibujo": la moto mide siempre ~85 px de largo en pantalla, sea cual sea el zoom (como Travel Animator)
    const mpp=40075016*Math.cos(moto.pos[1]*Math.PI/180)/(512*Math.pow(2,this.map.getZoom()));
    const s=mc.meterInMercatorCoordinateUnits()*(85*mpp/2.1);
    const l=new THREE.Matrix4().makeTranslation(mc.x,mc.y,mc.z).scale(new THREE.Vector3(s,-s,s))
      .multiply(new THREE.Matrix4().makeRotationX(Math.PI/2)).multiply(new THREE.Matrix4().makeRotationY(-moto.heading*Math.PI/180+Math.PI));
    this.camera.projectionMatrix=new THREE.Matrix4().fromArray(mm).multiply(l);
    this.renderer.resetState();this.renderer.render(this.scene,this.camera);
  }};

/* ── capa de encima: fotos en tarjetas grandes → burbujas, rótulos ── */
function roundImg(img,x,y,r){g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();const k=Math.max(2*r/img.width,2*r/img.height);g.drawImage(img,x-img.width*k/2,y-img.height*k/2,img.width*k,img.height*k);g.restore();}
function bubble(x,y,img,r){ // burbuja clavada: foto redonda, borde blanco y pico hacia su sitio
  g.save();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(x+3,y-r*1.75+5,r*1.13,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.moveTo(x-r*.35,y-r*1.75+r*.85);g.lineTo(x,y);g.lineTo(x+r*.35,y-r*1.75+r*.85);g.closePath();g.fill();
  g.beginPath();g.arc(x,y-r*1.75,r*1.13,0,7);g.fill();g.restore();roundImg(img,x,y-r*1.75,r);
}
function card(img,cx,cy,w,sc,rot,alpha,stop){ // polaroid: foto + franja blanca con el logo de la marca y el pueblo y el día
  if(sc<=.01)return;const h=w*1.2,pad=w*.045;g.save();g.globalAlpha*=alpha;g.translate(cx,cy);g.rotate(rot);g.scale(sc,sc);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-w/2+10,-h/2+14,w,h);g.fillStyle='#fff';g.fillRect(-w/2,-h/2,w,h);
  const iw=w-pad*2,ih=w-pad*2;g.save();g.beginPath();g.rect(-w/2+pad,-h/2+pad,iw,ih);g.clip();const k=Math.max(iw/img.width,ih/img.height);
  g.drawImage(img,-w/2+pad+(iw-img.width*k)/2,-h/2+pad+(ih-img.height*k)/2,img.width*k,img.height*k);g.restore();
  if(w>200){ // franja de abajo (solo cuando la tarjeta es grande)
    const yb=-h/2+pad+ih+(h-pad-ih)/2,fs=w*.056;g.textBaseline='middle';
    g.font=`800 ${fs}px "Barlow Condensed","Arial Narrow",sans-serif`;let x=-w/2+pad;
    [['✦ BORRADO','#F4630B'],['DEL','#8E9194'],['MAPA','#F4630B']].forEach(([t,c])=>{g.fillStyle=c;g.fillText(t,x,yb);x+=g.measureText(t).width;});
    if(stop){g.font=`700 ${w*.034}px "Barlow Condensed","Arial Narrow",sans-serif`;g.fillStyle='#5b5f63';g.textAlign='right';
      g.fillText(`${stop.nombre.toUpperCase()} · DÍA ${stop.dia}`,w/2-pad,yb);g.textAlign='left';}
  }
  g.restore();
}
function chip(txt,x,y,size,align,dark){g.save();g.font=`800 ${size}px "Barlow Condensed","Arial Narrow",sans-serif`;const w=g.measureText(txt).width+size*.8,h=size*1.25;
  const x0=align==='center'?x-w/2:align==='right'?x-w:x;g.fillStyle=dark?'rgba(13,15,16,.88)':'#F4630B';g.fillRect(x0,y,w,h);g.fillStyle=dark?'#ECEBE8':'#0D0F10';g.textBaseline='middle';g.fillText(txt,x0+size*.4,y+h/2+1);g.restore();}
function drawOverlay(cam,t){
  g.clearRect(0,0,W,H);
  const P=ll=>{const q=map.project(ll);return[q.x*PR,q.y*PR];};
  // burbujas de lo ya visitado (grandes: 56 px de radio)
  R.paradas.forEach((p,i)=>{if(p.km>cam.km+1e-6||(cam.s.k==='parada'&&cam.s.i===i))return;const ph=PH[i]&&PH[i][PH[i].length-1];if(!ph)return;const[x,y]=P([p.lng,p.lat]);if(y<-50||y>H+200)return;bubble(x,y,ph,56);});
  // en la parada: cada foto sale en grande (tarjeta casi a lo ancho), se ve y se encoge a su burbuja
  if(cam.s.k==='parada'){const s=cam.s,ph=PH[s.i]||[],lt=cam.lt*s.dur,[px,py]=P([s.p.lng,s.p.lat]),n=ph.length;
    ph.forEach((im,k)=>{const a=.35+k*1.05,b=a+1.05,tt=(lt-a)/(b-a);if(lt<a||tt>=1)return;const last=k===n-1;
      const inn=eback(clamp(tt/.28,0,1)),out=smooth(clamp((tt-.72)/.28,0,1)),rot=(k%2?1:-1)*.035;
      if(last){ // la última vuela a su sitio del mapa y se convierte en la burbuja
        card(im,lerp(W/2,px,out),lerp(H*.42,py-100,out),lerp(W*.8,112,out),inn,lerp(rot,0,out),1,s.p);}
      else{ // las demás salen hacia un lado, sin tocar el mapa
        card(im,W/2-out*W*.9*(k%2?-1:1),H*.42,W*.8,inn,rot,1-out*.4,s.p);}});
    if(ph[0]&&lt>.35+n*1.05)bubble(px,py,ph[n-1]||ph[0],56);}
  // rótulos
  if(cam.s.k==='intro'||cam.s.k==='bajar'){const a=cam.s.k==='intro'?eout(clamp(cam.lt*2,0,1)):1-eout(cam.lt);g.save();g.globalAlpha=a;
    const gr=g.createLinearGradient(0,H*.55,0,H);gr.addColorStop(0,'rgba(13,15,16,0)');gr.addColorStop(1,'rgba(13,15,16,.85)');g.fillStyle=gr;g.fillRect(0,H*.55,W,H*.45);
    g.fillStyle='#fff';g.font='800 124px "Barlow Condensed","Arial Narrow",sans-serif';g.fillText(R.titulo.toUpperCase(),48,H*.82);
    chip(`${Math.round(R.total)} KM · ${R.paradas.length} PARADAS`,52,H*.855,40);g.restore();}
  if(cam.s.k==='parada'||cam.s.k==='tramo'){const p=cam.s.k==='parada'?cam.s.p:R.paradas[cam.s.i+1];
    chip(`DÍA ${p.dia} · ${p.nombre.toUpperCase()}`,44,86,48);chip(`${Math.round(cam.km)} KM`,W-44,H-190,56,'right',true);}
  if(cam.s.k==='cierre'){const a=eout(clamp((cam.lt-.3)/.4,0,1));g.save();g.globalAlpha=a;g.fillStyle='rgba(13,15,16,.9)';g.fillRect(0,H*.66,W,H*.34);
    g.fillStyle='#F4630B';g.font='800 140px "Barlow Condensed",sans-serif';g.fillText(String(Math.round(R.total)),48,H*.8);
    g.fillStyle='#C4C7C9';g.font='600 30px Inter,sans-serif';g.fillText('KM POR CARRETERA',54,H*.84);
    g.fillStyle='#ECEBE8';g.font='800 44px "Barlow Condensed",sans-serif';g.fillText('✦ BORRADO DEL MAPA',48,H*.93);g.restore();}
  g.save();g.font='600 18px Inter,sans-serif';g.fillStyle='rgba(13,15,16,.65)';g.fillText('© OpenStreetMap · Relieve: AWS Terrain Tiles',16,H-14);g.restore();
}

/* ── aplicar un instante ── */
let lastB=null;
function frameAt(t,reset){
  const cam=camAt(t);const b=cam.b;lastB=b;
  map.jumpTo({center:cam.c,zoom:cam.z,bearing:b,pitch:cam.p});
  const done=[];for(let i=0;i<R.coords.length&&cum[i]<=cam.km;i++)done.push(R.coords[i]);done.push(posAt(cam.km));
  map.getSource('hecha').setData({type:'Feature',geometry:{type:'LineString',coordinates:done.length>1?done:[done[0],done[0]]}});
  // giro de la moto suavizado en el tiempo: como mucho sigue el 22 % del cambio por fotograma
  const th=headingAt(cam.km);moto.heading=(reset||moto._h==null)?th:angLerp(moto._h,th,.22);moto._h=moto.heading;
  moto.visible=cam.veh;moto.pos=cam.c;
  return cam;
}
const waitVisible=()=>document.hidden?new Promise(r=>{$('#note').textContent='En pausa: vuelve a esta pantalla para seguir';
  const f=()=>{if(!document.hidden){document.removeEventListener('visibilitychange',f);r();}};document.addEventListener('visibilitychange',f);}):Promise.resolve();
const waitIdle=async()=>{await waitVisible();await new Promise(r=>{let done=false;const ok=()=>{if(!done){done=true;r();}};setTimeout(ok,4000);
  if(map.loaded()&&map.areTilesLoaded()){map.once('render',ok);map.triggerRepaint();}else map.once('idle',ok);});};

/* ── vista previa ── */
let playing=false,T=0,last=0;
function tick(now){if(!playing)return;T+=Math.min(.25,(now-last)/1000);last=now;if(T>=TL.total){T=TL.total;playing=false;$('#play').textContent='▶';}
  const cam=frameAt(T);map.once('render',()=>drawOverlay(cam,T));map.triggerRepaint();$('#pbar').style.width=(T/TL.total*100)+'%';if(playing)requestAnimationFrame(tick);}
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'❚❚':'▶';if(playing){if(T>=TL.total-.05){T=0;lastB=null;}last=performance.now();requestAnimationFrame(tick);}};

/* ── MP4 ── */
$('#mp4').onclick=async()=>{
  playing=false;$('#play').textContent='▶';$('#mp4').disabled=true;$('#play').disabled=true;
  if(typeof VideoEncoder==='undefined'){$('#note').textContent='Este navegador no puede crear MP4. Prueba con Chrome.';return;}
  const cfg={codec:'avc1.4d0028',width:W,height:H,bitrate:9e6,framerate:FPS,avc:{format:'avc'}};
  try{if(!(await VideoEncoder.isConfigSupported(cfg)).supported)cfg.codec='avc1.42e028';}catch(_){}
  const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  let err=null;const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>err=e});enc.configure(cfg);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  const N=Math.ceil(TL.total*FPS),t0=performance.now();lastB=null;
  let wake=null;try{wake=await navigator.wakeLock.request('screen');}catch(_){}
  for(let f=0;f<N;f++){if(err)break;const t=f/FPS;const cam=frameAt(t,f===0);await waitIdle();drawOverlay(cam,t);
    cx.drawImage(map.getCanvas(),0,0,W,H);cx.drawImage(ov,0,0);
    const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});enc.encode(vf,{keyFrame:f%60===0});vf.close();
    while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,2));
    if(f%5===0){$('#pbar').style.width=(f/N*100)+'%';$('#note').textContent=`Creando el vídeo: ${Math.round(f/N*100)} %`;}}
  try{await enc.flush();}catch(e){err=e;}try{wake&&wake.release();}catch(_){}
  if(err){$('#note').textContent='No se pudo crear: '+(err.message||err);$('#mp4').disabled=false;$('#play').disabled=false;return;}
  mux.finalize();const blob=new Blob([mux.target.buffer],{type:'video/mp4'}),url=URL.createObjectURL(blob);
  $('#note').textContent=`Listo en ${Math.round((performance.now()-t0)/1000)} s · ${(blob.size/1048576).toFixed(1)} MB`;
  const o=document.createElement('div');o.className='res';o.innerHTML=`<video controls playsinline autoplay src="${url}"></video><button class="x" type="button" aria-label="Cerrar">✕</button><div class="row"><button class="btn" type="button" id="sh">Compartir</button><a class="btn ghost" href="${url}" download="muestra-cantabria.mp4">Descargar</a></div>`;
  document.body.appendChild(o);o.querySelector('.x').onclick=()=>o.remove();
  o.querySelector('#sh').onclick=async()=>{const file=new File([blob],'muestra-cantabria.mp4',{type:'video/mp4'});try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});}catch(_){}};
  $('#mp4').disabled=false;$('#play').disabled=false;
};

window.__muestra={TL:()=>TL,camAt,frameAt,drawOverlay,waitIdle}; // para revisar fotogramas concretos
/* ── arranque: mapa, ruta y precarga de todo el recorrido (la vista previa no se para a cargar) ── */
function fit(){const st=$('#stage'),k=Math.min(1,(innerWidth-24)/360,(innerHeight-190)/640);st.style.transform=`scale(${k})`;st.style.marginBottom=`${(k-1)*640}px`;}
addEventListener('resize',fit);fit();
const loadImg=u=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u;});
(async()=>{
  try{await Promise.all(['800 40px "Barlow Condensed"','600 20px Inter'].map(f=>document.fonts.load(f)));}catch(_){}
  R=await (await fetch('/muestra-video/ruta-cantabria.json')).json();prepRoute();
  PH=(await Promise.all(R.paradas.map((p,i)=>Promise.all([0,1,2].slice(0,i%2?3:2).map(k=>loadImg(`https://picsum.photos/seed/cant${i}${k}/720/720`)))))).map(x=>x.filter(Boolean));
  TL=buildTimeline();
  let a=[180,90,-180,-90];R.coords.forEach(([x,y])=>{a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)];});
  map=new maplibregl.Map({container:'map',style,center:[(a[0]+a[2])/2,(a[1]+a[3])/2],zoom:8,interactive:false,attributionControl:false,
    canvasContextAttributes:{preserveDrawingBuffer:true,antialias:true},pixelRatio:PR,fadeDuration:0,maxPitch:75});
  map.on('load',async()=>{
    const cam=map.cameraForBounds([[a[0],a[1]],[a[2],a[3]]],{padding:{top:150,bottom:330,left:40,right:40}});overview={center:[cam.center.lng,cam.center.lat],zoom:cam.zoom};
    map.addSource('toda',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:R.coords}}});
    map.addSource('hecha',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[R.coords[0],R.coords[0]]}}});
    map.addLayer({id:'toda',type:'line',source:'toda',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-opacity':.85,'line-width':['interpolate',['linear'],['zoom'],8,2,14,5],'line-dasharray':[1.2,1.4]}});
    map.addLayer({id:'hecha-borde',type:'line',source:'hecha',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],8,6,14,14]}});
    map.addLayer({id:'hecha',type:'line',source:'hecha',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#F4630B','line-width':['interpolate',['linear'],['zoom'],8,3.5,14,8]}});
    map.addLayer(motoLayer);
    // precarga: se recorre el guion una vez para tener todo el mapa y el relieve listos
    const steps=Math.ceil(TL.total/.6);
    for(let k=0;k<=steps;k++){frameAt(Math.min(TL.total,k*.6),k===0);await waitIdle();$('#note').textContent=`Preparando el mapa ${Math.round(k/steps*100)} %`;$('#pbar').style.width=(k/steps*100)+'%';}
    T=0;const c0=frameAt(0,true);await waitIdle();drawOverlay(c0,0);$('#pbar').style.width='0%';
    $('#play').disabled=false;$('#mp4').disabled=false;$('#note').textContent='Muestra v3 con tu ruta de Cantabria (261 km): mapa quieto, moto fluida, fotos de ejemplo.';
  });
  map.on('error',e=>{console.warn(e&&e.error);});
})();
