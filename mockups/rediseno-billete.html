<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Índice billete + modo ruta — Borrado del Mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   MOCKUP · no es producción
   A) ÍNDICE = BILLETE: creador de ruta. Destino + días a la vista,
      los otros 6 tips (de los 8 del flujo guiado) plegados en "AFINAR".
   B) CON RUTA ACTIVA: modo compañero de viaje, funcionamiento distinto.
   Toggle arriba para ver los dos.
   ══════════════════════════════════════════════════ */
:root{
  --bg:#050505; --panel:#0a0a0a; --flap:#171613;
  --ink:#fff; --ink-2:#d9d4c6; --ink-3:#9c978a;
  --amber:#f0b429; --amber-hi:#ffc947; --amber-ink:#0a0a0a;
  --green:#43d977; --red:#ff5a5a;
  --line:rgba(255,255,255,.34); --line-hi:rgba(255,255,255,.60);
  --f-sign:'Archivo',sans-serif; --f-body:'Inter',sans-serif;
  --f-flap:'JetBrains Mono',monospace; --f-logo:'Bebas Neue',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#000;color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px 60px;}
.sign{font-family:var(--f-sign);text-transform:uppercase;letter-spacing:.05em;}

.toggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.toggle button{font-family:var(--f-flap);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:0;background:var(--panel);color:var(--ink-2);padding:9px 18px;cursor:pointer;}
.toggle button+button{border-left:1px solid var(--line);}
.toggle button.on{background:var(--amber);color:#000;font-weight:700;}

.phone{width:390px;max-width:100%;border-radius:38px;padding:10px;background:#1a1a1a;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08);}
.screen{position:relative;width:100%;height:760px;border-radius:30px;overflow:hidden;background:var(--bg);}
.screen::before{content:'';position:absolute;inset:0;opacity:.45;background:radial-gradient(120% 70% at 75% 8%,rgba(240,180,41,.12),transparent 55%),repeating-linear-gradient(118deg,rgba(240,180,41,.05) 0 2px,transparent 2px 30px);}
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:20px 14px 0;overflow-y:auto;scrollbar-width:none;}
.scr::-webkit-scrollbar{display:none;}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:9px;}
.top .hi{font-family:var(--f-flap);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);}
.top .meta{font-family:var(--f-flap);font-size:11px;letter-spacing:.12em;color:var(--ink-2);}
.greet{font-family:var(--f-sign);text-transform:uppercase;font-weight:800;font-size:23px;letter-spacing:.02em;margin:13px 0 14px;}

/* ══ BILLETE ══ */
.ticket{border:1.5px solid var(--amber);border-radius:8px;background:var(--panel);overflow:hidden;}
.tk-head{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1.5px solid var(--amber);background:linear-gradient(90deg,rgba(240,180,41,.16),rgba(240,180,41,.04));}
.tk-head .b{font-family:var(--f-logo);font-size:15px;letter-spacing:.08em;}
.tk-head .b span{color:var(--amber);}
.tk-head .t{font-family:var(--f-flap);font-size:9px;letter-spacing:.18em;color:var(--ink-2);text-transform:uppercase;}

.fld{padding:12px 13px;border-bottom:1px dashed var(--line);}
.fld .k{font-family:var(--f-flap);font-size:9px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:7px;}
.fld input.big{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line-hi);color:var(--ink);font-family:var(--f-sign);text-transform:uppercase;font-weight:800;font-size:22px;letter-spacing:.03em;padding:2px 0 6px;outline:none;}
.fld input.big::placeholder{color:var(--ink-3);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:var(--f-sign);text-transform:uppercase;font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--ink);background:var(--panel);border:1.5px solid var(--line-hi);border-radius:3px;padding:8px 11px;cursor:pointer;}
.chip.on{background:var(--amber);border-color:var(--amber);color:#000;}
.chip.on.g{background:var(--green);border-color:var(--green);}

.afinar{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink-2);font-family:var(--f-flap);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.afinar .cnt{color:var(--ink-3);}
.more{display:none;}
.more.open{display:block;}

/* perforación + talón */
.perf{position:relative;height:0;border-top:2px dashed var(--line-hi);margin:0 6px;}
.perf::before,.perf::after{content:'';position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:#1a1a1a;}
.perf::before{left:-14px;} .perf::after{right:-14px;}
.stub{padding:13px;}
.emit{width:100%;border:0;cursor:pointer;background:var(--amber);color:#000;font-family:var(--f-sign);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:15px;padding:15px;border-radius:4px;display:flex;align-items:center;justify-content:space-between;}
.emit:hover{background:var(--amber-hi);}
.stub .hint{text-align:center;font-family:var(--f-flap);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:9px;}

.or{text-align:center;font-family:var(--f-flap);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:13px 0;}
.or b{color:var(--ink-2);}

/* fila utilidades (igual que la app) */
.util{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 6px;scrollbar-width:none;}
.util::-webkit-scrollbar{display:none;}
.u{flex-shrink:0;font-family:var(--f-sign);text-transform:uppercase;font-weight:700;font-size:11px;letter-spacing:.04em;white-space:nowrap;color:var(--ink);background:var(--panel);border:1.5px solid var(--line-hi);border-radius:3px;padding:9px 12px;}
.u.sos{color:var(--red);border-color:var(--red);}

/* ══ MODO RUTA ACTIVA ══ */
.rt{border:1.5px solid var(--green);border-radius:8px;background:var(--panel);overflow:hidden;}
.rt-head{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1.5px solid var(--green);background:linear-gradient(90deg,rgba(67,217,119,.16),rgba(67,217,119,.03));}
.rt-head .s{font-family:var(--f-flap);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:7px;}
.rt-head .s::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);}
.rt-head .d{font-family:var(--f-flap);font-size:11px;color:var(--ink-2);letter-spacing:.1em;}
.rt-next{padding:14px 13px;border-bottom:1px solid var(--line);}
.rt-next .k{font-family:var(--f-flap);font-size:9px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px;}
.rt-next .n{font-family:var(--f-sign);text-transform:uppercase;font-weight:800;font-size:24px;letter-spacing:.02em;line-height:1.05;}
.rt-next .sub{font-family:var(--f-flap);font-size:11px;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin-top:5px;}
.rt-stats{display:flex;gap:8px;padding:12px 13px;border-bottom:1px solid var(--line);}
.rt-stats div{flex:1;text-align:center;}
.rt-stats .k{font-family:var(--f-flap);font-size:8px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:5px;}
.rt-stats .v{font-family:var(--f-flap);font-weight:800;font-size:15px;color:var(--green);background:var(--flap);border:1px solid var(--line);border-radius:2px;padding:7px 2px;position:relative;}
.rt-stats .v::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);}
.rt-today{padding:12px 13px;border-bottom:1px solid var(--line);}
.rt-today .k{font-family:var(--f-flap);font-size:9px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:8px;}
.rt-today .row{display:flex;align-items:center;gap:9px;font-family:var(--f-flap);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:5px 0;color:var(--ink);}
.rt-today .row.done{color:var(--ink-3);}
.rt-today .row .dot{width:12px;height:12px;border:1.5px solid var(--line-hi);border-radius:50%;flex-shrink:0;}
.rt-today .row.done .dot{background:var(--green);border-color:var(--green);}
.rt-today .row.now .dot{border-color:var(--green);box-shadow:0 0 8px var(--green);}
.rt-cta{display:flex;gap:8px;padding:13px;}
.rt-cta .main{flex:1;border:0;cursor:pointer;background:var(--green);color:#0a0a0a;font-family:var(--f-sign);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:14px;padding:13px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;}
.rt-cta .alt{width:48px;flex-shrink:0;border:1px solid var(--line-hi);background:transparent;color:var(--ink);border-radius:4px;font-size:15px;cursor:pointer;}
.rt-actions{display:flex;gap:7px;overflow-x:auto;padding:12px 1px 4px;scrollbar-width:none;}
.rt-actions::-webkit-scrollbar{display:none;}

/* barras fijas */
.ibar{position:sticky;bottom:52px;margin-top:auto;z-index:3;display:flex;gap:7px;align-items:center;padding:9px 0 10px;background:var(--bg);border-top:1.5px solid var(--line-hi);}
.ibar input{flex:1;background:var(--bg);border:1.5px solid var(--line-hi);border-radius:3px;color:var(--ink);font-family:var(--f-body);font-size:14px;padding:11px 12px;outline:none;min-width:0;}
.ibar input::placeholder{color:var(--ink-3);}
.ibar .rnd{width:40px;height:40px;flex-shrink:0;border-radius:3px;border:1.5px solid var(--line-hi);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;}
.bbar{position:sticky;bottom:0;z-index:3;height:52px;background:var(--panel);border-top:1.5px solid var(--line-hi);display:flex;align-items:center;justify-content:space-around;margin:0 -14px;}
.bbar a{font-family:var(--f-flap);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
.bbar a.on{color:var(--amber);}

.cap{font-family:var(--f-flap);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);max-width:390px;text-align:center;line-height:1.7;}
.cap b{color:var(--ink-2);}
</style>
</head>
<body>

<div class="toggle">
  <button class="on" data-v="billete">Billete (sin ruta)</button>
  <button data-v="ruta">Con ruta activa</button>
</div>

<div class="phone">
  <div class="screen"><div class="scr" id="scr"><!-- JS --></div></div>
</div>

<div class="cap" id="cap"></div>

<template id="tpl-billete">
  <div class="top"><span class="hi">Buenas, Paco</span><span class="meta">SEP · SEVILLA</span></div>
  <div class="greet sign">¿A dónde te llevo?</div>

  <div class="ticket">
    <div class="tk-head"><span class="b">BORRADO<span>DEL</span>MAPA</span><span class="t">Billete de ruta</span></div>

    <div class="fld">
      <div class="k">Destino</div>
      <input class="big" placeholder="¿A dónde?">
    </div>

    <div class="fld">
      <div class="k">Días</div>
      <div class="chips" data-single>
        <button class="chip">3–4</button>
        <button class="chip on">5–7</button>
        <button class="chip">8–14</button>
        <button class="chip">+14</button>
      </div>
    </div>

    <button class="afinar" id="afinar">Afinar la ruta <span class="cnt">6 detalles · opcional ▾</span></button>

    <div class="more" id="more">
      <div class="fld">
        <div class="k">Fechas</div>
        <div class="chips" data-single><button class="chip on">A ojo</button><button class="chip">Tengo fechas</button></div>
      </div>
      <div class="fld">
        <div class="k">Con quién</div>
        <div class="chips" data-single><button class="chip on">Solo</button><button class="chip">Pareja</button><button class="chip">Familia</button><button class="chip">Amigos</button></div>
      </div>
      <div class="fld">
        <div class="k">Presupuesto / día</div>
        <div class="chips" data-single><button class="chip">Ajustado</button><button class="chip on">Medio</button><button class="chip">Sin límite</button></div>
      </div>
      <div class="fld">
        <div class="k">Ritmo</div>
        <div class="chips" data-single><button class="chip">Tranquilo</button><button class="chip on">Equilibrado</button><button class="chip">Intenso</button></div>
      </div>
      <div class="fld">
        <div class="k">Intereses</div>
        <div class="chips"><button class="chip on g">Cultura</button><button class="chip on g">Gastronomía</button><button class="chip">Naturaleza</button><button class="chip">Playa</button><button class="chip">Fiesta</button><button class="chip">Compras</button></div>
      </div>
      <div class="fld" style="border-bottom:0">
        <div class="k">Notas</div>
        <input class="big" style="font-family:var(--f-body);text-transform:none;font-size:14px;font-weight:400" placeholder="Dieta, movilidad, lo que sea…">
      </div>
    </div>

    <div class="perf"></div>
    <div class="stub">
      <button class="emit">Emitir billete <span>→</span></button>
      <div class="hint">Salma monta la ruta con lo que hayas puesto</div>
    </div>
  </div>

  <div class="or">o <b>díctame el plan entero</b> abajo ↓</div>

  <div class="util">
    <div class="u">Cerca mía</div><div class="u">Vuelos</div><div class="u">Alojamiento</div>
    <div class="u">Notas</div><div class="u">Moneda</div><div class="u">Traductor</div><div class="u sos">SOS</div>
  </div>

  <div class="ibar"><input placeholder="Ej: Vietnam 10 días en moto"><span class="rnd">🔊</span><span class="rnd">📷</span><span class="rnd">🎤</span></div>
  <div class="bbar"><a>Mis viajes</a><a>Historia</a><a>Nuevo</a><a class="on">Salma</a><a>Entrar</a></div>
</template>

<template id="tpl-ruta">
  <div class="top"><span class="hi">En ruta · Paco</span><span class="meta">11:20 · A CORUÑA</span></div>
  <div class="greet sign">Costa da Morte</div>

  <div class="rt">
    <div class="rt-head"><span class="s">En ruta · en hora</span><span class="d">DÍA 2 / 4</span></div>

    <div class="rt-next">
      <div class="k">Próxima parada</div>
      <div class="n">Camariñas</div>
      <div class="sub">A 14 km · 22 min en coche</div>
    </div>

    <div class="rt-stats">
      <div><div class="k">A la próxima</div><div class="v">14 KM</div></div>
      <div><div class="k">Paradas hoy</div><div class="v">1 / 4</div></div>
      <div><div class="k">Tiempo</div><div class="v">19°</div></div>
    </div>

    <div class="rt-today">
      <div class="k">Hoy · día 2</div>
      <div class="row done"><span class="dot"></span>Muxía</div>
      <div class="row now"><span class="dot"></span>Camariñas <span style="color:var(--green)">· ahora</span></div>
      <div class="row"><span class="dot"></span>Cabo Vilán</div>
      <div class="row"><span class="dot"></span>Ponteceso</div>
    </div>

    <div class="rt-cta">
      <button class="main">Abrir el mapa <span>→</span></button>
      <button class="alt" title="Diario">📓</button>
    </div>
  </div>

  <div class="rt-actions">
    <div class="u">Narrar zona</div><div class="u">Diario</div><div class="u">Buscar comida</div>
    <div class="u">Dónde dormir</div><div class="u">Cambiar ruta</div><div class="u sos">SOS</div>
  </div>

  <div class="or">o <b>pregúntale a Salma</b> abajo ↓</div>

  <div class="ibar"><input placeholder="¿Un sitio para comer cerca?"><span class="rnd">🔊</span><span class="rnd">📷</span><span class="rnd">🎤</span></div>
  <div class="bbar"><a>Mis viajes</a><a>Historia</a><a>Nuevo</a><a class="on">Salma</a><a>Entrar</a></div>
</template>

<script>
const scr=document.getElementById('scr'), cap=document.getElementById('cap');
const CAP={
  billete:'A · El índice ES el billete. <b>Destino + días</b> a la vista; los otros 6 tips del flujo guiado, plegados en <b>“Afinar”</b>. “Emitir billete” = mismo flujo guiado de hoy con los 8 campos ya rellenos (0 tokens). El texto libre sigue abajo para quien prefiera dictar.',
  ruta:'B · Con ruta activa el índice cambia de función: <b>compañero de viaje</b>. Próxima parada + distancia, paradas de hoy, tiempo, botón al mapa, y acciones de “en ruta” (narrar, diario, comida, dormir) en vez de las de planificar.'
};
function render(v){
  scr.innerHTML='';
  scr.appendChild(document.getElementById('tpl-'+v).content.cloneNode(true));
  cap.innerHTML=CAP[v];
  // chips single-select
  scr.querySelectorAll('.chips[data-single]').forEach(g=>{
    g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');});
  });
  // intereses multi
  scr.querySelectorAll('.chips:not([data-single]) .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on')||c.classList.toggle('g'));
  // afinar
  const a=scr.querySelector('#afinar'), m=scr.querySelector('#more');
  if(a) a.onclick=()=>{m.classList.toggle('open');a.querySelector('.cnt').textContent=m.classList.contains('open')?'ocultar ▴':'6 detalles · opcional ▾';};
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.toggle button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.v);
});
render('billete');
</script>
</body>
</html>
